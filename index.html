<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151519">
<title>あんスタ 好き顔9選</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section id="start" class="screen active">
    <div class="eyebrow">ENSEMBLE STARS!! / FAN MADE</div>
    <h1>あんスタ<br><em>好き顔9選</em></h1>
    <p class="lead">54人の中から、顔が好きな人を好きなだけ選んで<br>あなたの「好き顔」をランキング。</p>
    <p class="notice">非公式ファン制作コンテンツ</p>
    <button class="primary" id="startBtn">START</button>
  </section>

  <section id="select" class="screen">
    <header class="head">
      <div><div class="eyebrow">SELECT</div><h2>好きな顔を好きなだけ選ぶ</h2></div>
      <div class="pill"><b id="count">0</b> 人</div>
    </header>
    <p class="sub">54人の中から「顔が好き」と思う人数を自由に選択してください。2人以上でスタートできます。</p>
    <div id="grid" class="grid"></div>
    <div class="sticky"><button class="primary" id="confirm" disabled>2人以上を選択</button></div>
  </section>

  <section id="rank" class="screen">
    <div class="eyebrow">FACE BATTLE</div>
    <h2>どっちの顔が好き？</h2>
    <p class="sub center"><span id="progress">1</span> / <span id="total">36</span></p>
    <div id="battle" class="battle"></div>
    <button class="skip" id="skip">引き分け</button>
  </section>

  <section id="result" class="screen">
    <div class="eyebrow">YOUR RESULT</div>
    <h1>好き顔<br><em>TOP 9</em></h1>
    <div id="results" class="results"></div>
    <button class="primary" id="copy">結果をコピー</button>
    <button class="skip" id="again">もう一度遊ぶ</button>
    <p id="copied" class="copied"></p>
    <p class="copyright">本サイトは非公式のファン制作コンテンツです。<br>© Happy Elements K.K</p>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
